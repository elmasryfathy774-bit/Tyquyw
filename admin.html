<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حضور | لوحة الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="adm">
<div id="login" class="login" hidden>
  <form id="lf" class="lbox" novalidate>
    <h1>حضور — دخول الإدارة والمعلمين</h1>
    <label for="lu">اسم المستخدم</label>
    <input id="lu" dir="ltr" autocomplete="username" required>
    <label for="lp">كلمة المرور</label>
    <input id="lp" type="password" dir="ltr" autocomplete="current-password" required>
    <button class="btn" id="lb" type="submit"><span class="spin" id="ls" hidden></span><span id="lt">تسجيل الدخول</span></button>
    <p class="err" id="le" role="alert"></p>
    <p class="note"><a href="index.html">الرجوع لصفحة المدرسة</a></p>
  </form>
</div>

<div id="shell" hidden>
  <header class="top">
    <b id="sname">حضور</b>
    <span class="who" id="who"></span>
    <button class="btn alt sm" id="out">خروج</button>
  </header>
  <nav id="tabs" class="tabs" aria-label="أقسام اللوحة"></nav>
  <main id="view" aria-live="polite"></main>
</div>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><button class="btn alt sm mx" id="mx" aria-label="إغلاق">إغلاق ✕</button><div id="mb"></div></div></div>
<div id="toast" class="toast" role="status"></div>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
